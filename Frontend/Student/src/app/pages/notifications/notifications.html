<div class="notifications-container">

  <div class="header-section">
    <div class="title-with-icon">
      <span class="header-icon"><i class="fa-solid fa-bell"></i></span>
      <h2>Notifications</h2>
    </div>
  </div>

  <div class="notifications-card">

    @if (notifications.length === 0) {
      <div class="empty-state">
        <div class="empty-icon"><i class="fa-solid fa-bell"></i></div>
        <h3>No Notifications</h3>
        <p>You don't have any notifications yet.</p>
      </div>
    }

    @for (item of notifications; track item.id) {
      <div class="notification-item">

        <div class="icon-container" [ngClass]="getZoomClass(item.type)">
          <span class="icon">{{ getIcon(item.type) }}</span>
        </div>

        <div class="content-container">
          <h3>{{ item.title }}</h3>
          <p>{{ item.body }}</p>
        </div>

        <div class="time-container">
          <span class="time">{{ item.sentAt | date:'d MMM, y' }}</span>
          <span class="priority-badge" [ngClass]="'priority--' + item.priority?.toLowerCase()">
            {{ item.priority }}
          </span>
        </div>

      </div>
    }

  </div>

</div>
