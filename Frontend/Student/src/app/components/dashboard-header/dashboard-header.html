<nav class="navbar">

  <!-- Left: Avatar + Name -->
  <div class="nav-user">
    <div class="avatar">
      {{ getInitials() }}
    </div>
    <div class="user-info">
      @if (profile()) {
        <span class="user-name">{{ profile()!.fullName }}</span>
        <span class="user-role">{{ profile()!.role | titlecase }}</span>
      } @else {
        <span class="user-name skeleton-text"></span>
        <span class="user-role skeleton-text small"></span>
      }
    </div>
    <div class="notif-dot" aria-label="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="notif-badge"></span>
    </div>
  </div>

  <!-- Center: Search -->
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="#aaa" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" placeholder="Search anything..." aria-label="Search"/>
  </div>

</nav>
