<div class="login-container">

  <!-- Left Section -->
  <div class="left-side">

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <div class="welcome-text">
      <h1>Welcome Back</h1>
      <p>Please Login to your account</p>
    </div>

  </div>

  <!-- Right Section -->
  <div class="right-side">

    <img
      src="../assets/images/NTG-logo.jpg"
      class="logo"
      alt="Login Image">

    <h2>Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="input-box">

        <img src="../assets/images/mail.png" class="img1" alt="Email">

        <input
          type="email"
          placeholder="Enter Your Email"
          formControlName="email">

      </div>

      <div
        class="error"
        *ngIf="loginForm.get('email')?.touched &&
               loginForm.get('email')?.errors?.['required']">

        Email is required.

      </div>

      <div
        class="error"
        *ngIf="loginForm.get('email')?.touched &&
               loginForm.get('email')?.errors?.['email']">

        Please enter a valid email.

      </div>

      <!-- Password -->
      <div class="input-box">

        <img src="../assets/images/password.png" class="img1" alt="Password">

        <input
          type="password"
          placeholder="Enter Your Password"
          formControlName="password">

      </div>

      <div
        class="error"
        *ngIf="loginForm.get('password')?.touched &&
               loginForm.get('password')?.errors?.['required']">

        Password is required.

      </div>

      <div
        class="error"
        *ngIf="loginForm.get('password')?.touched &&
               loginForm.get('password')?.errors?.['minlength']">

        Password must be at least 6 characters.

      </div>

      <!-- Options -->
      <div class="options">

        <label>
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">Forgot Password?</a>

      </div>

      <!-- Button -->
<button type="submit" [disabled]="loginForm.invalid || isLoading">Login</button>
    </form>

  </div>

</div>
