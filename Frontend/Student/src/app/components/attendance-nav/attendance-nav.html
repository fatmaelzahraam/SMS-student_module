<div class="header">
  <div class="header-left">
    <div class="header-title-group">
      <span class="header-icon" aria-hidden="true">
        <img src="../assets/images/attendancepage.png" width="40px"
             height="40px"
             alt="logo">
      </span>
    </div>
    <div class="header-title-group2">
      <h1 class="header-title">Attendance</h1>
      <p class="header-sub">Track your attendance records</p>
    </div>
  </div>

  <div class="header-right">
    <div class="notif-dot" aria-label="Notifications">
      <span aria-hidden="true" routerLink="/notifications"><i class="fa-regular fa-bell"></i></span>
      <span class="notif-badge"></span>
    </div>

    <div class="nav-user">
      <a class="avatar" routerLink="/profile">
        {{ getInitials() }}
      </a>
    </div>
  </div>
</div>
<div class="links tabs">

  <a
     routerLink="/attendance"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }">
  Overview
  </a>

  <a  
  routerLink="/attendance/daily"
  routerLinkActive="active">
  Daily
  </a>

  <a
     routerLink="/attendance/monthly"
  routerLinkActive="active">
  Monthly
  </a>

</div>
